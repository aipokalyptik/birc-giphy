<svg xmlns="http://www.w3.org/2000/svg" width="760" height="500" viewBox="0 0 760 500" role="img" aria-labelledby="title description">
  <title id="title">Solarized Dark bIRC semantic colorscheme preview</title>
  <description id="description">Transcript preview showing ordinary messages, history, a mention, an action, membership events, a notice, an error, a reply, a link card, and reactions using the generated custom CSS palette.</description>
  <rect width="760" height="500" rx="12" fill="#002b36"/>
  <rect x="18" y="18" width="724" height="464" rx="9" fill="#002b36" stroke="#073642"/>
  <text x="32" y="50" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="700" fill="#268bd2">#palette-lab</text>
  <text x="728" y="50" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#586e75">Solarized Dark</text>
  <line x1="30" y1="65" x2="730" y2="65" stroke="#073642"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">
    <text x="28" y="92" fill="#586e75">12:40</text>
    <text x="104" y="92" fill="#2aa198" font-weight="700">Ada</text>
    <text x="205" y="92" fill="#839496">The semantic preview is ready.</text>
    <text x="28" y="121" fill="#586e75">12:41</text>
    <text x="104" y="121" fill="#586e75" font-weight="700">Lin</text>
    <text x="205" y="121" fill="#586e75">Older history remains deliberately quiet.</text>
    <rect x="24" y="137" width="712" height="31" rx="3" fill="#073642"/>
    <rect x="24" y="137" width="4" height="31" fill="#d33682"/>
    <text x="28" y="158" fill="#586e75">12:42</text>
    <text x="104" y="158" fill="#268bd2" font-weight="700">Mira</text>
    <text x="205" y="158" fill="#839496">Ada: this mention uses the search/Visual color.</text>
    <text x="28" y="193" fill="#586e75">12:43</text>
    <text x="104" y="193" fill="#d33682" font-style="italic">* Lin ships the new palette</text>
    <text x="28" y="222" fill="#859900">→ Jo joined #palette-lab</text>
    <text x="28" y="251" fill="#586e75">← Pat left #palette-lab</text>
    <text x="28" y="280" fill="#b58900">— Notice: preview regeneration completed</text>
    <text x="28" y="309" fill="#dc322f">! Error: one unsafe declaration was rejected</text>
    <rect x="28" y="328" width="4" height="44" fill="#268bd2"/>
    <text x="44" y="346" fill="#586e75">↳ Ada: The semantic preview is ready.</text>
    <text x="44" y="366" fill="#839496">The reply rail follows the upstream link color.</text>
    <rect x="28" y="387" width="704" height="64" rx="6" fill="#073642" stroke="#586e75"/>
    <text x="44" y="412" fill="#268bd2" font-weight="700">Canonical upstream palette</text>
    <text x="44" y="435" fill="#586e75">Editor roles adapted to transcript semantics</text>
    <rect x="596" y="405" width="116" height="28" rx="14" fill="#073642" stroke="#268bd2"/>
    <text x="654" y="424" text-anchor="middle" fill="#268bd2">✓ 4   ★ 2</text>
  </g>
</svg>
