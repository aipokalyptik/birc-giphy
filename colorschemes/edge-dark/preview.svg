<svg xmlns="http://www.w3.org/2000/svg" width="760" height="500" viewBox="0 0 760 500" role="img" aria-labelledby="title description">
  <title id="title">Edge Dark bIRC semantic colorscheme preview</title>
  <description id="description">Transcript preview showing ordinary messages, history, a mention, an action, membership events, a notice, an error, a reply, a link card, and reactions using the generated custom CSS palette.</description>
  <rect width="760" height="500" rx="12" fill="#2c2e34"/>
  <rect x="18" y="18" width="724" height="464" rx="9" fill="#2c2e34" stroke="#363944"/>
  <text x="32" y="50" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="700" fill="#6cb6eb">#palette-lab</text>
  <text x="728" y="50" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#758094">Edge Dark</text>
  <line x1="30" y1="65" x2="730" y2="65" stroke="#363944"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">
    <text x="28" y="92" fill="#758094">12:40</text>
    <text x="104" y="92" fill="#5dbbc1" font-weight="700">Ada</text>
    <text x="205" y="92" fill="#c5cdd9">The semantic preview is ready.</text>
    <text x="28" y="121" fill="#758094">12:41</text>
    <text x="104" y="121" fill="#758094" font-weight="700">Lin</text>
    <text x="205" y="121" fill="#758094">Older history remains deliberately quiet.</text>
    <rect x="24" y="137" width="712" height="31" rx="3" fill="#3b3e48"/>
    <rect x="24" y="137" width="4" height="31" fill="#d38aea"/>
    <text x="28" y="158" fill="#758094">12:42</text>
    <text x="104" y="158" fill="#6cb6eb" font-weight="700">Mira</text>
    <text x="205" y="158" fill="#c5cdd9">Ada: this mention uses the search/Visual color.</text>
    <text x="28" y="193" fill="#758094">12:43</text>
    <text x="104" y="193" fill="#d38aea" font-style="italic">* Lin ships the new palette</text>
    <text x="28" y="222" fill="#a0c980">→ Jo joined #palette-lab</text>
    <text x="28" y="251" fill="#758094">← Pat left #palette-lab</text>
    <text x="28" y="280" fill="#deb974">— Notice: preview regeneration completed</text>
    <text x="28" y="309" fill="#ec7279">! Error: one unsafe declaration was rejected</text>
    <rect x="28" y="328" width="4" height="44" fill="#6cb6eb"/>
    <text x="44" y="346" fill="#758094">↳ Ada: The semantic preview is ready.</text>
    <text x="44" y="366" fill="#c5cdd9">The reply rail follows the upstream link color.</text>
    <rect x="28" y="387" width="704" height="64" rx="6" fill="#363944" stroke="#758094"/>
    <text x="44" y="412" fill="#6cb6eb" font-weight="700">Canonical upstream palette</text>
    <text x="44" y="435" fill="#758094">Editor roles adapted to transcript semantics</text>
    <rect x="596" y="405" width="116" height="28" rx="14" fill="#363944" stroke="#6cb6eb"/>
    <text x="654" y="424" text-anchor="middle" fill="#6cb6eb">✓ 4   ★ 2</text>
  </g>
</svg>
