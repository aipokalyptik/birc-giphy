<svg xmlns="http://www.w3.org/2000/svg" width="640" height="260" viewBox="0 0 640 260" role="img" aria-labelledby="title description">
  <title id="title">Kanagawa Wave bIRC colorscheme preview</title>
  <description id="description">Example chat window using the adapted background, text, and accent colors.</description>
  <rect width="640" height="260" rx="12" fill="#1f1f28"/>
  <rect width="640" height="38" rx="12" fill="#7e9cd8"/>
  <rect y="26" width="640" height="12" fill="#7e9cd8"/>
  <circle cx="22" cy="19" r="6" fill="#1f1f28" opacity="0.72"/>
  <circle cx="42" cy="19" r="6" fill="#dcd7ba" opacity="0.72"/>
  <text x="320" y="25" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700" fill="#1f1f28">Kanagawa Wave</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">
    <text x="22" y="72" fill="#7e9cd8" font-weight="700">#developers</text>
    <text x="22" y="105" fill="#7e9cd8">12:41  &lt;Ada&gt;</text>
    <text x="164" y="105" fill="#dcd7ba">The new build is ready to test.</text>
    <text x="22" y="137" fill="#7e9cd8">12:42  &lt;Lin&gt;</text>
    <text x="164" y="137" fill="#dcd7ba">Looks good — shipping it now.</text>
    <text x="22" y="169" fill="#7e9cd8">12:43  *</text>
    <text x="111" y="169" fill="#dcd7ba">Ada tags @Lin in the release note.</text>
  </g>
  <rect x="22" y="202" width="596" height="36" rx="6" fill="#dcd7ba" opacity="0.09"/>
  <text x="36" y="225" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#dcd7ba">Message #developers</text>
  <rect x="496" y="202" width="122" height="36" rx="6" fill="#7e9cd8"/>
  <text x="557" y="225" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#1f1f28">Send</text>
</svg>
