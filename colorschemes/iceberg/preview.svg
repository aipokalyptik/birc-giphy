<svg xmlns="http://www.w3.org/2000/svg" width="760" height="500" viewBox="0 0 760 500" role="img" aria-labelledby="title description">
  <title id="title">Iceberg bIRC semantic colorscheme preview</title>
  <description id="description">Transcript preview showing ordinary messages, history, a mention, an action, membership events, a notice, an error, a reply, a link card, and reactions using the generated custom CSS palette.</description>
  <rect width="760" height="500" rx="12" fill="#161821"/>
  <rect x="18" y="18" width="724" height="464" rx="9" fill="#161821" stroke="#1e2132"/>
  <text x="32" y="50" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="700" fill="#84a0c6">#palette-lab</text>
  <text x="728" y="50" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#6b7089">Iceberg</text>
  <line x1="30" y1="65" x2="730" y2="65" stroke="#1e2132"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">
    <text x="28" y="92" fill="#6b7089">12:40</text>
    <text x="104" y="92" fill="#89b8c2" font-weight="700">Ada</text>
    <text x="205" y="92" fill="#c6c8d1">The semantic preview is ready.</text>
    <text x="28" y="121" fill="#6b7089">12:41</text>
    <text x="104" y="121" fill="#6b7089" font-weight="700">Lin</text>
    <text x="205" y="121" fill="#6b7089">Older history remains deliberately quiet.</text>
    <rect x="24" y="137" width="712" height="31" rx="3" fill="#272c42"/>
    <rect x="24" y="137" width="4" height="31" fill="#a093c7"/>
    <text x="28" y="158" fill="#6b7089">12:42</text>
    <text x="104" y="158" fill="#84a0c6" font-weight="700">Mira</text>
    <text x="205" y="158" fill="#c6c8d1">Ada: this mention uses the search/Visual color.</text>
    <text x="28" y="193" fill="#6b7089">12:43</text>
    <text x="104" y="193" fill="#a093c7" font-style="italic">* Lin ships the new palette</text>
    <text x="28" y="222" fill="#b4be82">→ Jo joined #palette-lab</text>
    <text x="28" y="251" fill="#6b7089">← Pat left #palette-lab</text>
    <text x="28" y="280" fill="#e2a478">— Notice: preview regeneration completed</text>
    <text x="28" y="309" fill="#e27878">! Error: one unsafe declaration was rejected</text>
    <rect x="28" y="328" width="4" height="44" fill="#84a0c6"/>
    <text x="44" y="346" fill="#6b7089">↳ Ada: The semantic preview is ready.</text>
    <text x="44" y="366" fill="#c6c8d1">The reply rail follows the upstream link color.</text>
    <rect x="28" y="387" width="704" height="64" rx="6" fill="#1e2132" stroke="#6b7089"/>
    <text x="44" y="412" fill="#84a0c6" font-weight="700">Canonical upstream palette</text>
    <text x="44" y="435" fill="#6b7089">Editor roles adapted to transcript semantics</text>
    <rect x="596" y="405" width="116" height="28" rx="14" fill="#1e2132" stroke="#84a0c6"/>
    <text x="654" y="424" text-anchor="middle" fill="#84a0c6">✓ 4   ★ 2</text>
  </g>
</svg>
