<svg xmlns="http://www.w3.org/2000/svg" width="760" height="500" viewBox="0 0 760 500" role="img" aria-labelledby="title description">
  <title id="title">Gruvbox Material Light bIRC semantic colorscheme preview</title>
  <description id="description">Transcript preview showing ordinary messages, history, a mention, an action, membership events, a notice, an error, a reply, a link card, and reactions using the generated custom CSS palette.</description>
  <rect width="760" height="500" rx="12" fill="#fbf1c7"/>
  <rect x="18" y="18" width="724" height="464" rx="9" fill="#fbf1c7" stroke="#f2e5bc"/>
  <text x="32" y="50" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="700" fill="#45707a">#palette-lab</text>
  <text x="728" y="50" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#928374">Gruvbox Material Light</text>
  <line x1="30" y1="65" x2="730" y2="65" stroke="#f2e5bc"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">
    <text x="28" y="92" fill="#928374">12:40</text>
    <text x="104" y="92" fill="#4c7a5d" font-weight="700">Ada</text>
    <text x="205" y="92" fill="#654735">The semantic preview is ready.</text>
    <text x="28" y="121" fill="#928374">12:41</text>
    <text x="104" y="121" fill="#928374" font-weight="700">Lin</text>
    <text x="205" y="121" fill="#928374">Older history remains deliberately quiet.</text>
    <rect x="24" y="137" width="712" height="31" rx="3" fill="#eee0b7"/>
    <rect x="24" y="137" width="4" height="31" fill="#945e80"/>
    <text x="28" y="158" fill="#928374">12:42</text>
    <text x="104" y="158" fill="#45707a" font-weight="700">Mira</text>
    <text x="205" y="158" fill="#654735">Ada: this mention uses the search/Visual color.</text>
    <text x="28" y="193" fill="#928374">12:43</text>
    <text x="104" y="193" fill="#945e80" font-style="italic">* Lin ships the new palette</text>
    <text x="28" y="222" fill="#6c782e">→ Jo joined #palette-lab</text>
    <text x="28" y="251" fill="#928374">← Pat left #palette-lab</text>
    <text x="28" y="280" fill="#b47109">— Notice: preview regeneration completed</text>
    <text x="28" y="309" fill="#c14a4a">! Error: one unsafe declaration was rejected</text>
    <rect x="28" y="328" width="4" height="44" fill="#45707a"/>
    <text x="44" y="346" fill="#928374">↳ Ada: The semantic preview is ready.</text>
    <text x="44" y="366" fill="#654735">The reply rail follows the upstream link color.</text>
    <rect x="28" y="387" width="704" height="64" rx="6" fill="#f2e5bc" stroke="#928374"/>
    <text x="44" y="412" fill="#45707a" font-weight="700">Canonical upstream palette</text>
    <text x="44" y="435" fill="#928374">Editor roles adapted to transcript semantics</text>
    <rect x="596" y="405" width="116" height="28" rx="14" fill="#f2e5bc" stroke="#45707a"/>
    <text x="654" y="424" text-anchor="middle" fill="#45707a">✓ 4   ★ 2</text>
  </g>
</svg>
